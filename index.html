    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ateeq-theme');
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = pref === 'system' ? (systemDark ? 'dark' : 'light') : pref;
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(resolved);
          root.dataset.themePref = pref;
          root.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0A0A0A' : '#F7FAFC');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
